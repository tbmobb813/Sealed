packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 blocks dependency build scripts unless explicitly allowed.
allowBuilds:
  "@clerk/shared": true
  "@prisma/client": true
  "@prisma/engines": true
  bufferutil: true
  core-js: true
  esbuild: true
  prisma: true
  unrs-resolver: true
  utf-8-validate: true

publicHoistPattern:
  - "*@prisma*"
shamefullyHoist: true

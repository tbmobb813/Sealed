version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: sealed-postgres
    environment:
      POSTGRES_USER: sealed
      POSTGRES_PASSWORD: sealed_dev
      POSTGRES_DB: sealed
    ports:
      - "5432:5432"
    volumes:
      - sealed_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sealed-redis
    ports:
      - "6379:6379"

volumes:
  sealed_postgres_data:
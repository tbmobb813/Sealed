name: Deploy

# Web deploys to Vercel from this workflow (requires VERCEL_TOKEN,
# VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets — see docs/DEPLOYMENT.md).
# The API deploys via Railway's GitHub integration (railway.json +
# apps/api/Dockerfile), not from this workflow.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy.yml"

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from package.json packageManager (pnpm@11.9.0)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - run: pnpm build
        env:
          NEXT_PUBLIC_DEMO_MODE: "false"
          # Accept either secret name (NEXT_PUBLIC_* is preferred for clarity)
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}

  deploy-web:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip gracefully until Vercel secrets are configured
      - id: guard
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VERCEL_TOKEN not set — skipping web deploy"
          fi

      - if: steps.guard.outputs.configured == 'true'
        run: npm install -g vercel

      # Env vars (NEXT_PUBLIC_API_URL, Clerk keys, etc.) live in the
      # Vercel project settings and are pulled here, not passed from CI.
      - if: steps.guard.outputs.configured == 'true'
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

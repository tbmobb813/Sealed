name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sealed
          POSTGRES_PASSWORD: sealed_dev
          POSTGRES_DB: sealed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sealed -d sealed"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sealed:sealed_dev@localhost:5432/sealed
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from package.json packageManager (pnpm@9.15.4)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm --filter @sealed/api db:migrate:deploy

      - run: pnpm build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"

      - run: pnpm test

      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:e2e
        env:
          CI: "true"
          DATABASE_URL: postgresql://sealed:sealed_dev@localhost:5432/sealed
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"

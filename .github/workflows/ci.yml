name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sealed
          POSTGRES_PASSWORD: sealed_dev
          POSTGRES_DB: sealed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sealed -d sealed"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sealed:sealed_dev@localhost:5432/sealed
      REDIS_URL: redis://localhost:6379
      DEMO_MODE: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      # prisma generate phones home to Prisma's checkpoint/telemetry service
      # by default; a slow/blocked outbound call there hangs the whole step
      # with no log output. turbo.json's test task reruns db:generate a
      # second time (cache: false) right after the explicit step below, so
      # this needs to be disabled, not just fast on a lucky network day.
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@v7

      # pnpm version is read from package.json packageManager (pnpm@11.9.0)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm --filter @sealed/api db:migrate:deploy

      - run: pnpm build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"

      - run: pnpm test

      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:e2e
        env:
          CI: "true"
          DATABASE_URL: postgresql://sealed:sealed_dev@localhost:5432/sealed
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
